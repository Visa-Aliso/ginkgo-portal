<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="文章、关于我与一些随想。银杏与风里的小小入口。"
    />
    <meta name="theme-color" content="#f8fafb" />
    <title>银杏与风</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const preference = localStorage.getItem("ginkgo-theme") || "system";
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="ginkgo-wind-portal">
      <div class="qp-page" aria-label="个人站点入口">
        <canvas class="qp-canopy" aria-hidden="true"></canvas>
        <canvas class="qp-leaves" aria-hidden="true"></canvas>
        <div class="qp-toolbar">
          <header class="qp-header"></header>
          <div class="qp-tools">
            <button
              type="button"
              class="qp-wind-button cursor-interaction"
              aria-label="吹开所有银杏叶"
            >
              <i data-lucide="wind" aria-hidden="true"></i>
            </button>
            <div class="qp-theme-switch">
              <button
                type="button"
                class="qp-theme-trigger cursor-interaction"
                aria-label="切换外观"
                aria-expanded="false"
                aria-controls="ginkgo-theme-options"
              >
                <span data-theme-icon="light"
                  ><i data-lucide="sun" aria-hidden="true"></i></span
                ><span data-theme-icon="dark" hidden
                  ><i data-lucide="moon" aria-hidden="true"></i
                ></span>
              </button>
              <div
                id="ginkgo-theme-options"
                class="qp-theme-options"
                role="group"
                aria-label="外观模式"
                hidden
              >
                <button
                  type="button"
                  class="qp-theme-button cursor-interaction"
                  data-theme-choice="light"
                  aria-label="白色模式"
                  aria-pressed="false"
                >
                  <i data-lucide="sun" aria-hidden="true"></i><span>白色</span>
                </button>
                <button
                  type="button"
                  class="qp-theme-button cursor-interaction"
                  data-theme-choice="dark"
                  aria-label="深色模式"
                  aria-pressed="false"
                >
                  <i data-lucide="moon" aria-hidden="true"></i><span>深色</span>
                </button>
                <button
                  type="button"
                  class="qp-theme-button cursor-interaction"
                  data-theme-choice="system"
                  aria-label="跟随系统"
                  aria-pressed="true"
                >
                  <i data-lucide="monitor" aria-hidden="true"></i
                  ><span>跟随系统</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="qp-stage" aria-label="独立站点入口">
          <a
            class="qp-window qp-blog cursor-interaction"
            href="#"
            data-site="Blog"
            aria-label="Blog，点击展开文章摘页"
          >
            <span class="qp-article-sheet">
              <span class="qp-article-content"
                ><span class="qp-word">Blog</span
                ><span class="qp-caption">文章与记录</span></span
              >
              <span class="qp-article-lines qp-article-print" aria-hidden="true"
                ><span></span><span></span><span></span
              ></span>
              <span class="qp-article-crease" aria-hidden="true"></span>
            </span>
            <span class="qp-article-flap" aria-hidden="true">
              <span class="qp-article-face qp-article-front"
                ><span class="qp-article-print qp-article-top-lines"
                  ><span></span><span></span><span></span></span
              ></span>
              <span class="qp-article-face qp-article-back"
                ><span class="qp-article-fold-rule"></span
                ><span class="qp-arrow"
                  ><i data-lucide="arrow-up-right"></i></span
              ></span>
            </span>
          </a>
          <a
            class="qp-window qp-profile cursor-interaction"
            href="#"
            data-site="Profile"
            aria-label="Profile，拖动体验手感或点击观看打开动画"
          >
            <span class="qp-surface">
              <span class="qp-portrait qp-detail" aria-hidden="true"
                ><span class="qp-head"
                  ><span class="qp-face"
                    ><span class="qp-eye qp-eye-left"></span
                    ><span class="qp-eye qp-eye-right"></span></span></span
                ><span class="qp-portrait-shadow"></span
              ></span>
              <span class="qp-titles"
                ><span class="qp-word">Profile</span
                ><span class="qp-caption">关于我</span></span
              >
              <span class="qp-arrow" aria-hidden="true"
                ><i data-lucide="arrow-up-right"></i
              ></span>
            </span>
          </a>
          <a
            class="qp-window qp-notes cursor-interaction"
            href="#"
            data-site="Notes"
            aria-label="Notes，拖动体验手感或点击观看打开动画"
          >
            <span
              class="qp-note-layer qp-note-back qp-detail"
              aria-hidden="true"
            ></span
            ><span
              class="qp-note-layer qp-note-middle qp-detail"
              aria-hidden="true"
            ></span>
            <span class="qp-surface qp-note-front">
              <span class="qp-ink qp-detail" aria-hidden="true"
                ><span></span><span></span
              ></span>
              <span class="qp-titles"
                ><span class="qp-word">Notes</span
                ><span class="qp-caption">一些随想</span></span
              >
              <span class="qp-arrow" aria-hidden="true"
                ><i data-lucide="arrow-up-right"></i
              ></span>
              <span class="qp-note-fold qp-detail" aria-hidden="true"></span>
            </span>
          </a>
        </div>
        <span class="qp-announcement" role="status" aria-live="polite"></span>
      </div>
    </div>

    <noscript
      ><p class="no-script">请启用 JavaScript 以体验银杏与风。</p></noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
